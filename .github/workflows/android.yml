name: Android CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - hasan0525-h-fix-3d-viewer
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/android

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GLB assets
        run: |
          test -f app/src/main/assets/house.glb
          echo "GLB asset found"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run lint
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manzzzl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
