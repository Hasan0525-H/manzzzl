name: Manzl Teacher Contracts

on:
  pull_request:
    paths:
      - 'research/ultra-reconstruction/**'
      - '.github/workflows/manzl-teacher-contracts.yml'
  push:
    branches:
      - 'feature/manzl-*'
    paths:
      - 'research/ultra-reconstruction/**'
      - '.github/workflows/manzl-teacher-contracts.yml'

permissions:
  contents: read

concurrency:
  group: manzl-teacher-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teacher-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 shapely==2.0.6

      - name: Compile all reconstruction research scripts
        run: |
          python -m compileall -q research/ultra-reconstruction

      - name: Verify fail-closed teacher contracts
        run: |
          python -m unittest discover \
            -s research/ultra-reconstruction \
            -p 'test_*.py' \
            -v

  cubicasa-checkpoint-fingerprint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download official CubiCasa checkpoint
        run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0
          gdown 'https://drive.google.com/uc?id=1gRB7ez1e4H7a9Y09lLqRuna0luZO5VRK' \
            -O /tmp/model_best_val_loss_var.pkl

      - name: Fingerprint checkpoint
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          path = pathlib.Path('/tmp/model_best_val_loss_var.pkl')
          data = path.read_bytes()
          if len(data) < 100_000_000:
              raise SystemExit(f'checkpoint unexpectedly small: {len(data)} bytes')
          prefix = data[:64].lstrip().lower()
          if prefix.startswith(b'<!doctype html') or prefix.startswith(b'<html'):
              raise SystemExit('Google Drive returned HTML instead of checkpoint bytes')
          print('CUBICASA_CHECKPOINT_FINGERPRINT=' + json.dumps({
              'sourceFileId': '1gRB7ez1e4H7a9Y09lLqRuna0luZO5VRK',
              'fileName': 'model_best_val_loss_var.pkl',
              'bytes': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
              'first16Hex': data[:16].hex(),
          }, sort_keys=True))
          PY
