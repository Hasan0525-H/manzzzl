name: Manzl Teacher Contracts

on:
  pull_request:
    paths:
      - 'research/ultra-reconstruction/**'
      - '.github/workflows/manzl-teacher-contracts.yml'
  push:
    branches:
      - 'feature/manzl-*'
    paths:
      - 'research/ultra-reconstruction/**'
      - '.github/workflows/manzl-teacher-contracts.yml'

permissions:
  contents: read

concurrency:
  group: manzl-teacher-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teacher-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 shapely==2.0.6

      - name: Compile all reconstruction research scripts
        run: |
          python -m compileall -q research/ultra-reconstruction

      - name: Verify fail-closed teacher contracts
        run: |
          python -m unittest discover \
            -s research/ultra-reconstruction \
            -p 'test_*.py' \
            -v

  raster2seq-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Manzl
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned CPU inference runtime
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.3.1 torchvision==0.18.1 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            pillow==10.4.0 \
            pycocotools==2.0.8 \
            fvcore==0.1.5.post20221221 \
            cloudpickle==2.1.0 \
            omegaconf==2.2.2 \
            fairscale==0.4.6 \
            timm==0.5.4 \
            scipy==1.10.1

      - name: Checkout pinned Raster2Seq source
        run: |
          git clone --filter=blob:none https://github.com/Cornell-VAILab/Raster2Seq.git /tmp/Raster2Seq
          git -C /tmp/Raster2Seq checkout --detach a6c4e27a68d11d7a459f6e4a2601fd887227dd1a
          test "$(git -C /tmp/Raster2Seq rev-parse HEAD)" = "a6c4e27a68d11d7a459f6e4a2601fd887227dd1a"

      - name: Restore pinned Raster2Graph-512 checkpoint cache
        id: raster2seq-checkpoint-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/Raster2Graph-512
          key: manzl-raster2graph-512-5736bf4fe1ebd8ef6cca63ea51c2c3f8971d6d1848dd9049fc5ca251bf565229

      - name: Fetch pinned Raster2Graph-512 checkpoint on cache miss
        if: steps.raster2seq-checkpoint-cache.outputs.cache-hit != 'true'
        run: |
          python research/ultra-reconstruction/fetch_raster2seq_teacher.py \
            --destination /tmp/Raster2Graph-512

      - name: Verify cached Raster2Graph-512 checkpoint
        if: steps.raster2seq-checkpoint-cache.outputs.cache-hit == 'true'
        run: |
          python research/ultra-reconstruction/fetch_raster2seq_teacher.py \
            --destination /tmp/Raster2Graph-512 \
            --verify-only

      - name: Save verified Raster2Graph-512 checkpoint cache
        if: steps.raster2seq-checkpoint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/Raster2Graph-512
          key: manzl-raster2graph-512-5736bf4fe1ebd8ef6cca63ea51c2c3f8971d6d1848dd9049fc5ca251bf565229

      - name: Create rights-safe floorplan smoke image
        run: |
          mkdir -p /tmp/manzl-r2s-input /tmp/manzl-r2s-output /tmp/manzl-r2s-adapted
          python - <<'PY'
          import cv2
          import numpy as np

          image = np.full((512, 512, 3), 255, dtype=np.uint8)
          cv2.rectangle(image, (34, 34), (478, 478), (15, 15, 15), 12)
          cv2.rectangle(image, (48, 48), (464, 464), (255, 255, 255), 4)
          cv2.line(image, (256, 46), (256, 466), (20, 20, 20), 10)
          cv2.line(image, (46, 250), (466, 250), (20, 20, 20), 10)
          cv2.line(image, (150, 252), (150, 466), (20, 20, 20), 9)
          cv2.rectangle(image, (249, 115), (263, 160), (255, 255, 255), -1)
          cv2.rectangle(image, (105, 243), (150, 257), (255, 255, 255), -1)
          cv2.rectangle(image, (249, 335), (263, 380), (255, 255, 255), -1)
          cv2.line(image, (92, 35), (165, 35), (120, 120, 120), 3)
          cv2.line(image, (92, 47), (165, 47), (120, 120, 120), 3)
          cv2.line(image, (477, 300), (477, 370), (120, 120, 120), 3)
          cv2.line(image, (465, 300), (465, 370), (120, 120, 120), 3)
          if not cv2.imwrite('/tmp/manzl-r2s-input/plan.png', image):
              raise SystemExit('failed to write Raster2Seq smoke input')
          PY

      - name: Run real Raster2Seq CPU-reference inference
        run: |
          python research/ultra-reconstruction/run_raster2seq_teacher.py \
            --input /tmp/manzl-r2s-input \
            --repository /tmp/Raster2Seq \
            --checkpoint-dir /tmp/Raster2Graph-512 \
            --output /tmp/manzl-r2s-output \
            --device cpu \
            --cpu-reference-attention

      - name: Adapt Raster2Seq output to strict Manzl evidence
        run: |
          python research/ultra-reconstruction/adapt_raster2seq_predictions.py \
            --prediction-root /tmp/manzl-r2s-output \
            --output /tmp/manzl-r2s-adapted

      - name: Verify topology-only consensus contract
        run: |
          python - <<'PY'
          import json
          import pathlib
          import numpy as np

          raw = pathlib.Path('/tmp/manzl-r2s-output/jsons/plan.json')
          adapted = pathlib.Path('/tmp/manzl-r2s-adapted/plan.npz')
          if not raw.is_file() or not adapted.is_file():
              raise SystemExit('Raster2Seq smoke artifacts are missing')
          records = json.loads(raw.read_text(encoding='utf-8'))
          if not isinstance(records, list) or not records:
              raise SystemExit('Raster2Seq smoke inference produced no room polygon')
          if any(int(record['category_id']) not in range(12) for record in records):
              raise SystemExit('Raster2Seq produced a category outside the pinned R2G room contract')
          with np.load(adapted, allow_pickle=False) as sample:
              classes = [str(value) for value in sample['semantic_classes'].tolist()]
              valid = np.asarray(sample['valid_mask'])
              fmt = str(np.asarray(sample['teacher_format']).reshape(-1)[0])
              if classes != ['room_boundary']:
                  raise SystemExit(f'unexpected Raster2Seq classes: {classes}')
              if fmt != 'raster2seq-r2g512-json-v3-room-boundary-only':
                  raise SystemExit(f'unexpected Raster2Seq format: {fmt}')
              if int(valid.sum()) <= 0:
                  raise SystemExit('Raster2Seq room-boundary evidence is empty')
          print('RASTER2SEQ_RUNTIME_SMOKE=' + json.dumps({
              'sourceRevision': 'a6c4e27a68d11d7a459f6e4a2601fd887227dd1a',
              'modelRevision': '6be66814dcc2420f0a3ac87591ba4b6e1b0b44b8',
              'checkpointSha256': '5736bf4fe1ebd8ef6cca63ea51c2c3f8971d6d1848dd9049fc5ca251bf565229',
              'rawRoomPolygons': len(records),
              'semanticClasses': ['room_boundary'],
              'passed': True,
          }, sort_keys=True))
          PY
