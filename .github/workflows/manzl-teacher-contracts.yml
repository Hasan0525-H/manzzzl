name: Manzl Teacher Contracts

on:
  pull_request:
    paths:
      - 'research/ultra-reconstruction/**'
      - '.github/workflows/manzl-teacher-contracts.yml'
  push:
    branches:
      - 'feature/manzl-*'
    paths:
      - 'research/ultra-reconstruction/**'
      - '.github/workflows/manzl-teacher-contracts.yml'

permissions:
  contents: read

concurrency:
  group: manzl-teacher-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teacher-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 shapely==2.0.6

      - name: Compile all reconstruction research scripts
        run: |
          python -m compileall -q research/ultra-reconstruction

      - name: Verify fail-closed teacher contracts
        run: |
          python -m unittest discover \
            -s research/ultra-reconstruction \
            -p 'test_*.py' \
            -v

  cubicasa-runtime-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Manzl
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install modern CPU runtime
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            gdown==5.2.0
          python -m pip install --disable-pip-version-check \
            torch==2.8.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Checkout pinned CubiCasa source
        run: |
          git clone --filter=blob:none https://github.com/CubiCasa/CubiCasa5k.git /tmp/CubiCasa5k
          git -C /tmp/CubiCasa5k checkout --detach c34440266665a11f4484eb06cd2e4b7d72ad76c1
          test "$(git -C /tmp/CubiCasa5k rev-parse HEAD)" = "c34440266665a11f4484eb06cd2e4b7d72ad76c1"

      - name: Fetch and verify pinned checkpoint
        run: |
          python research/ultra-reconstruction/fetch_cubicasa_teacher.py \
            --destination /tmp/model_best_val_loss_var.pkl

      - name: Create rights-safe smoke floorplan
        run: |
          mkdir -p /tmp/manzl-smoke-input /tmp/manzl-smoke-output
          python - <<'PY'
          import cv2
          import numpy as np

          image = np.full((256, 256, 3), 250, dtype=np.uint8)
          cv2.rectangle(image, (24, 24), (232, 232), (30, 30, 30), 8)
          cv2.line(image, (128, 28), (128, 228), (30, 30, 30), 7)
          cv2.line(image, (28, 128), (124, 128), (30, 30, 30), 7)
          cv2.rectangle(image, (123, 72), (133, 102), (250, 250, 250), -1)
          cv2.rectangle(image, (72, 123), (102, 133), (250, 250, 250), -1)
          if not cv2.imwrite('/tmp/manzl-smoke-input/plan.png', image):
              raise SystemExit('failed to write smoke input')
          PY

      - name: Run real CubiCasa CPU inference
        run: |
          python research/ultra-reconstruction/run_cubicasa_teacher.py \
            --input /tmp/manzl-smoke-input \
            --repository /tmp/CubiCasa5k \
            --checkpoint /tmp/model_best_val_loss_var.pkl \
            --output /tmp/manzl-smoke-output \
            --device cpu \
            --rotations 1

      - name: Verify consensus-ready output contract
        run: |
          python - <<'PY'
          import json
          import pathlib
          import numpy as np
          import torch

          path = pathlib.Path('/tmp/manzl-smoke-output/plan.npz')
          if not path.is_file():
              raise SystemExit('CubiCasa smoke output is missing')
          with np.load(path, allow_pickle=False) as sample:
              classes = [str(value) for value in sample['semantic_classes'].tolist()]
              probs = np.asarray(sample['semantic_probs'], dtype=np.float32)
              confidence = np.asarray(sample['confidence'], dtype=np.float32)
              valid = np.asarray(sample['valid_mask'])
              teacher_format = str(np.asarray(sample['teacher_format']).reshape(-1)[0])
          if classes != ['background', 'wall_face', 'door', 'window', 'room_boundary']:
              raise SystemExit(f'unexpected classes: {classes}')
          if probs.shape != (5, 256, 256):
              raise SystemExit(f'unexpected probability shape: {probs.shape}')
          if not np.isfinite(probs).all() or not np.isfinite(confidence).all():
              raise SystemExit('non-finite CubiCasa output')
          if not np.allclose(probs.sum(axis=0), 1.0, atol=1e-5):
              raise SystemExit('semantic probabilities do not sum to one')
          if valid.shape != (256, 256) or not np.all(valid == 1):
              raise SystemExit('invalid valid-mask contract')
          print('CUBICASA_RUNTIME_SMOKE=' + json.dumps({
              'pythonTorch': torch.__version__,
              'device': 'cpu',
              'inputShape': [256, 256, 3],
              'probabilityShape': list(probs.shape),
              'classes': classes,
              'teacherFormat': teacher_format,
              'roomBoundaryMaxProbability': float(probs[4].max()),
              'passed': True,
          }, sort_keys=True))
          PY
