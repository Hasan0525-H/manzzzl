name: Train Manzl Student

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/manzl-*'
    paths:
      - 'research/ultra-reconstruction/generate_rights_safe_synthetic.py'
      - 'research/ultra-reconstruction/generate_synthetic_corpus.py'
      - 'research/ultra-reconstruction/render_resplan_training.py'
      - 'research/ultra-reconstruction/evaluate_student_onnx.py'
      - 'research/ultra-reconstruction/train_student.py'
      - 'research/ultra-reconstruction/build_teacher_consensus.py'
      - '.github/workflows/train-manzl-student.yml'

permissions:
  contents: write

concurrency:
  group: manzl-student-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-student:
    runs-on: ubuntu-latest
    # Public-repository standard runner: spend time, not money, on a materially stronger bootstrap.
    # This is still not a release-quality substitute for the real teacher-consensus benchmark.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install local-training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.26.4 \
            onnx==1.17.0 \
            onnxruntime==1.22.1 \
            opencv-python-headless==4.10.0.84 \
            shapely==2.0.6
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Fetch pinned CC-BY ResPlan geometry
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import time
          import urllib.error
          import urllib.request

          commit = 'e2b78fe069aee1ab1e1828a612743f308e3c32a7'
          archive_url = f'https://raw.githubusercontent.com/m-agour/ResPlan/{commit}/ResPlan.zip'
          split_url = f'https://raw.githubusercontent.com/m-agour/ResPlan/{commit}/split.json'
          archive = pathlib.Path('/tmp/ResPlan.zip')
          split = pathlib.Path('/tmp/ResPlan-split.json')

          def fetch(url, destination, timeout):
              last = None
              for attempt in range(1, 7):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'Manzl-ResPlan-Training/2'})
                      with urllib.request.urlopen(request, timeout=timeout) as response, destination.open('wb') as output:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              output.write(chunk)
                      return
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as error:
                      last = error
                      if attempt == 6:
                          raise
                      delay = min(30, 2 ** attempt)
                      print(f'transient ResPlan fetch failure: {error}; retrying in {delay}s')
                      time.sleep(delay)
              raise last

          fetch(archive_url, archive, 180)
          fetch(split_url, split, 60)

          expected_size = 100106537
          expected_git_blob = '24d12b8739bdb55e0accc60ddd4cb460bcc9886c'
          data = archive.read_bytes()
          if len(data) != expected_size:
              raise SystemExit(f'ResPlan archive size mismatch: {len(data)} != {expected_size}')
          digest = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          if digest != expected_git_blob:
              raise SystemExit(f'ResPlan Git blob mismatch: {digest} != {expected_git_blob}')
          print(f'verified ResPlan CC-BY geometry blob: {digest} ({len(data)} bytes)')
          PY

      - name: Generate larger mixed rights-safe train corpus
        run: |
          rm -rf /tmp/manzl-train /tmp/manzl-val /tmp/manzl-student
          mkdir -p /tmp/manzl-train /tmp/manzl-val

          python research/ultra-reconstruction/generate_rights_safe_synthetic.py \
            --output /tmp/manzl-train --count 160 --size 512 --seed 43926
          python research/ultra-reconstruction/generate_rights_safe_synthetic.py \
            --output /tmp/manzl-val --count 48 --size 512 --seed 90439

          python research/ultra-reconstruction/generate_synthetic_corpus.py \
            --output /tmp/manzl-train --count 160 --size 512 --seed 260901
          python research/ultra-reconstruction/generate_synthetic_corpus.py \
            --output /tmp/manzl-val --count 48 --size 512 --seed 260902

          python research/ultra-reconstruction/render_resplan_training.py \
            --archive /tmp/ResPlan.zip \
            --split-json /tmp/ResPlan-split.json \
            --train-output /tmp/manzl-train \
            --val-output /tmp/manzl-val \
            --train-count 160 \
            --val-count 32 \
            --size 512 \
            --seed 20260901

          python - <<'PY'
          import pathlib
          train = list(pathlib.Path('/tmp/manzl-train').glob('*.npz'))
          val = list(pathlib.Path('/tmp/manzl-val').glob('*.npz'))
          assert len(train) == 480, len(train)
          assert len(val) == 128, len(val)
          print(f'train samples: {len(train)}; val samples: {len(val)}')
          PY

      - name: Train stronger proposal-only student
        run: |
          mkdir -p /tmp/manzl-student
          python research/ultra-reconstruction/train_student.py \
            --data /tmp/manzl-train \
            --val-data /tmp/manzl-val \
            --output /tmp/manzl-student/student.pt \
            --onnx /tmp/manzl-student/manzl_reconstruction_student.onnx \
            --size 512 \
            --width 16 \
            --epochs 8 \
            --batch 2 \
            --workers 2 \
            --lr 0.0003 \
            --patience 3 \
            --cpu

      - name: Validate exported ONNX contract
        run: |
          python - <<'PY'
          import json
          import pathlib
          import onnx

          model_path = pathlib.Path('/tmp/manzl-student/manzl_reconstruction_student.onnx')
          metadata_path = model_path.with_suffix('.json')
          model = onnx.load(model_path)
          onnx.checker.check_model(model)
          inputs = [value.name for value in model.graph.input]
          outputs = [value.name for value in model.graph.output]
          assert inputs == ['image'], inputs
          assert outputs == ['semantic_logits', 'corner_logits', 'wall_orientation'], outputs
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          assert metadata.get('inputSize') == 512
          assert len(metadata.get('semanticClasses', [])) == 9
          assert model_path.stat().st_size > 100_000
          print(json.dumps({'bytes': model_path.stat().st_size, 'outputs': outputs}, indent=2))
          PY

      - name: Run exported model and measure every semantic class
        run: |
          python research/ultra-reconstruction/evaluate_student_onnx.py \
            --model /tmp/manzl-student/manzl_reconstruction_student.onnx \
            --data /tmp/manzl-val \
            --output /tmp/manzl-student/manzl_reconstruction_student.bootstrap-eval.json \
            --size 512

      - name: Create explicit non-release quality attestation
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          model_path = pathlib.Path('/tmp/manzl-student/manzl_reconstruction_student.onnx')
          training_path = pathlib.Path('/tmp/manzl-student/manzl_reconstruction_student.json')
          evaluation_path = pathlib.Path('/tmp/manzl-student/manzl_reconstruction_student.bootstrap-eval.json')
          training = json.loads(training_path.read_text(encoding='utf-8'))
          evaluation = json.loads(evaluation_path.read_text(encoding='utf-8'))
          digest = hashlib.sha256(model_path.read_bytes()).hexdigest()
          attestation = {
              'schema': 5,
              'model': model_path.name,
              'sha256': digest,
              'bytes': model_path.stat().st_size,
              'trainingSource': 'two original Manzl procedural corpora + CC BY 4.0 ResPlan geometry renderings',
              'trainingSamples': 480,
              'validationSamples': 128,
              'architectureWidth': 16,
              'maxEpochs': 8,
              'resPlanAttribution': 'research/ultra-reconstruction/RESPLAN_ATTRIBUTION.md',
              'trainerValidation': training.get('validation'),
              'generatedValidation': evaluation,
              'proposalOnly': True,
              'realPlanBenchmarkPassed': False,
              'releaseReady': False,
              'reason': 'This stronger bootstrap makes the complete offline Ultra runtime executable and measures each class. It is still proposal-only: generated/ResPlan raster validation is not evidence of Saudi/Arabic real-plan accuracy. Multi-teacher consensus + real-plan regression gates remain mandatory before release.'
          }
          pathlib.Path('/tmp/manzl-student/manzl_reconstruction_student.quality.json').write_text(
              json.dumps(attestation, indent=2), encoding='utf-8'
          )
          PY

      - name: Upload student training artifact
        uses: actions/upload-artifact@v4
        with:
          name: manzl-student-bootstrap
          path: |
            /tmp/manzl-student/manzl_reconstruction_student.onnx
            /tmp/manzl-student/manzl_reconstruction_student.json
            /tmp/manzl-student/manzl_reconstruction_student.bootstrap-eval.json
            /tmp/manzl-student/manzl_reconstruction_student.quality.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit rights-safe bootstrap student onto latest feature head
        if: github.event_name == 'push'
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          mkdir -p manzl-app/src/main/assets/models
          cp /tmp/manzl-student/manzl_reconstruction_student.onnx \
            manzl-app/src/main/assets/models/manzl_reconstruction_student.onnx
          cp /tmp/manzl-student/manzl_reconstruction_student.json \
            manzl-app/src/main/assets/models/manzl_reconstruction_student.training.json
          cp /tmp/manzl-student/manzl_reconstruction_student.bootstrap-eval.json \
            manzl-app/src/main/assets/models/manzl_reconstruction_student.bootstrap-eval.json
          cp /tmp/manzl-student/manzl_reconstruction_student.quality.json \
            manzl-app/src/main/assets/models/manzl_reconstruction_student.quality.json

          python - <<'PY'
          import json
          import pathlib

          quality_path = pathlib.Path('manzl-app/src/main/assets/models/manzl_reconstruction_student.quality.json')
          quality = json.loads(quality_path.read_text(encoding='utf-8'))
          manifest_path = pathlib.Path('manzl-app/src/main/assets/models/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for item in manifest.get('required', []):
              if item.get('id') == 'manzl_reconstruction_student':
                  item['status'] = 'mixed-rights-safe-bootstrap-proposal-only'
                  item['sha256'] = quality['sha256']
                  item['releaseReady'] = False
                  item['trainingSource'] = quality['trainingSource']
                  item['attribution'] = quality['resPlanAttribution']
                  item['generatedValidation'] = 'models/manzl_reconstruction_student.bootstrap-eval.json'
          manifest_path.write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            manzl-app/src/main/assets/models/manzl_reconstruction_student.onnx \
            manzl-app/src/main/assets/models/manzl_reconstruction_student.training.json \
            manzl-app/src/main/assets/models/manzl_reconstruction_student.bootstrap-eval.json \
            manzl-app/src/main/assets/models/manzl_reconstruction_student.quality.json \
            manzl-app/src/main/assets/models/manifest.json
          if git diff --cached --quiet; then
            echo 'No student asset changes to commit.'
            exit 0
          fi
          git commit -m 'chore: package stronger proposal-only reconstruction student'
          git push origin HEAD:${GITHUB_REF_NAME}
