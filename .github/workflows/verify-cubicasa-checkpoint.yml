name: Verify CubiCasa Checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/manzl-*'
    paths:
      - '.github/workflows/verify-cubicasa-checkpoint.yml'

permissions:
  contents: read

concurrency:
  group: cubicasa-checkpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive downloader
        run: python -m pip install --disable-pip-version-check gdown==5.2.0

      - name: Download official CubiCasa weight
        run: |
          gdown 'https://drive.google.com/uc?id=1gRB7ez1e4H7a9Y09lLqRuna0luZO5VRK' \
            -O /tmp/model_best_val_loss_var.pkl

      - name: Fingerprint and sanity-check checkpoint bytes
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          path = pathlib.Path('/tmp/model_best_val_loss_var.pkl')
          data = path.read_bytes()
          if len(data) < 100_000_000:
              raise SystemExit(f'checkpoint unexpectedly small: {len(data)} bytes')
          prefix = data[:64].lstrip().lower()
          if prefix.startswith(b'<!doctype html') or prefix.startswith(b'<html'):
              raise SystemExit('Google Drive returned HTML instead of the checkpoint')
          report = {
              'sourceFileId': '1gRB7ez1e4H7a9Y09lLqRuna0luZO5VRK',
              'fileName': 'model_best_val_loss_var.pkl',
              'bytes': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
              'first16Hex': data[:16].hex(),
          }
          print('CUBICASA_CHECKPOINT_FINGERPRINT=' + json.dumps(report, sort_keys=True))
          PY
