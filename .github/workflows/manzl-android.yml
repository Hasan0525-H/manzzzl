name: Manzl Android

on:
  push:
    branches:
      - dev
      - main
      - 'feature/manzl-*'
    paths:
      - 'manzl-app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/manzl-android.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'manzl-app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'

permissions:
  contents: read

concurrency:
  group: manzl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify and build Manzl
        run: ./gradlew --no-daemon :manzl-app:testDebugUnitTest :manzl-app:lintDebug :manzl-app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manzl-debug-apk
          path: manzl-app/build/outputs/apk/debug/manzl-app-debug.apk
          if-no-files-found: error
          retention-days: 14
