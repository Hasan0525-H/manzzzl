name: Manzl Android

on:
  push:
    branches:
      - dev
      - main
      - 'feature/manzl-*'
    paths:
      - 'manzl-app/**'
      - 'research/ultra-reconstruction/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/manzl-android.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'manzl-app/**'
      - 'research/ultra-reconstruction/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'

permissions:
  contents: read

concurrency:
  group: manzl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ONNX contract dependency
        run: python -m pip install --disable-pip-version-check onnx==1.17.0

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Fetch verified MobileSAM runtime models
        run: python3 research/ultra-reconstruction/fetch_runtime_models.py

      - name: Verify MobileSAM ONNX graph contract
        run: |
          python3 research/ultra-reconstruction/verify_runtime_model_contracts.py \
            --assets manzl-app/src/main/assets/models

      - name: Require measured real local Ultra student before APK
        run: |
          python3 research/ultra-reconstruction/verify_packaged_release_student.py \
            --assets manzl-app/src/main/assets/models

      - name: Verify and build Manzl
        run: ./gradlew --no-daemon :manzl-app:testDebugUnitTest :manzl-app:lintDebug :manzl-app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manzl-debug-apk
          path: manzl-app/build/outputs/apk/debug/manzl-app-debug.apk
          if-no-files-found: error
          retention-days: 14
